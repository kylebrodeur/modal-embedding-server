name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest tests -q
      - name: Run lint
        run: uv run ruff check .