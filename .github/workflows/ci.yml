name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync dependencies
        run: uv sync --project server --group dev
      - name: Run tests
        run: uv run --project server pytest server/tests -q
      - name: Run lint
        run: uv run --project server ruff check server eval