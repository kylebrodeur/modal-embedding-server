[project]
name = "pvm-modal"
version = "0.1.0"
description = "pi-vault-mind Modal embedding app (server side)."
requires-python = ">=3.10"

# Test/dev deps only. The heavy ML stack (torch, sentence-transformers) is
# deliberately NOT listed here: the model layer is mocked in the test suite so
# `uv run pytest tests` works on a laptop with no GPU and no ML install. Those
# packages are baked into the Modal image (see app.py) for production.
[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "lancedb>=0.16.0",
    "pyarrow>=17.0.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"